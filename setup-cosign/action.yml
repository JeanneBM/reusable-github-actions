name: 'Setup Cosign'
description: 'Installs a pinned Cosign release after verifying its SHA-256 checksum'
author: 'JeanneBM'

branding:
  icon: 'lock'
  color: 'orange'

inputs:
  version:
    description: 'Exact Cosign version without the leading v. Empty uses the pin in lib/versions.env. Requires sha256.'
    required: false
    default: ''
  sha256:
    description: 'SHA-256 of cosign-linux-amd64 from the release cosign_checksums.txt'
    required: false
    default: ''

outputs:
  cosign-version:
    description: 'Installed version'
    value: ${{ steps.install.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Install verified Cosign binary
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
        LIB: ${{ github.action_path }}/../lib
      run: bash "$LIB/install-tool.sh" cosign "$VERSION" "$SHA256"
