name: 'Setup Trivy'
description: 'Installs a pinned Trivy release after verifying its SHA-256 checksum'
author: 'JeanneBM'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  version:
    description: 'Exact Trivy version without the leading v. Empty uses the pin in lib/versions.env. Requires sha256.'
    required: false
    default: ''
  sha256:
    description: 'SHA-256 of trivy_<version>_Linux-64bit.tar.gz from the release checksums file'
    required: false
    default: ''
  cache:
    description: 'Cache the vulnerability database for the current day'
    required: false
    default: 'true'

outputs:
  trivy-version:
    description: 'Installed version'
    value: ${{ steps.install.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Install verified Trivy binary
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
        LIB: ${{ github.action_path }}/../lib
      run: |
        bash "$LIB/install-tool.sh" trivy "$VERSION" "$SHA256"
        echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Cache Trivy DB
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ runner.os }}-${{ steps.install.outputs.date }}
        restore-keys: trivy-db-${{ runner.os }}-
