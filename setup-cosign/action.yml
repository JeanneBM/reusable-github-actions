name: 'Setup Cosign'
description: 'Installs Cosign for image signing and verification'
author: 'JeanneBM'

branding:
  icon: 'key'
  color: 'orange'

inputs:
  version:
    description: 'Cosign version'
    required: false
    default: 'latest'

outputs:
  cosign-version:
    description: 'Installed version'
    value: ${{ steps.install.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Install Cosign
      id: install
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "latest" ]; then
          VERSION=$(curl -s https://api.github.com/repos/sigstore/cosign/releases/latest | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
        else
          VERSION=${{ inputs.version }}
        fi
        
        curl -sL "https://github.com/sigstore/cosign/releases/download/v${VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
        chmod +x /usr/local/bin/cosign
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Cosign ${VERSION} installed"